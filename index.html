<style>
/* Layout: slim translucent top bar with underline tabs, one calm working column (max 1120px), hairlines instead of boxes, ink-black primary actions; detail pages for a bottle (QR target) and a chemical; forms in a modal dialog. */
:root{
  --bg:#f8f9f9; --surface:#ffffff; --surface-2:#f1f3f3; --fg:#0e1514; --muted:#66716f; --line:#e3e7e6;
  --accent:#0b5d55; --accent-fg:#ffffff; --accent-soft:#e3efed;
  --crit:#b42318; --crit-soft:#fdecea; --warn:#a15c07; --warn-soft:#fdf3e1; --ok:#1f7a3d; --ok-soft:#e6f4ea;
  --ghs:#d0261c; --ghs-bg:#ffffff; --shadow:0 1px 2px rgba(14,21,20,.04);
  --f-text:"Geist","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f0e; --surface:#111716; --surface-2:#182120; --fg:#eef2f1; --muted:#8f9b98; --line:#222c2a;
  --accent:#6fd0c2; --accent-fg:#06211e; --accent-soft:#143530;
  --crit:#ff8a80; --crit-soft:#3a1a18; --warn:#f0b35a; --warn-soft:#35280f; --ok:#7fd08c; --ok-soft:#17301d;
  --ghs:#f0605a; --ghs-bg:#111716; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0f0e; --surface:#111716; --surface-2:#182120; --fg:#eef2f1; --muted:#8f9b98; --line:#222c2a;
  --accent:#6fd0c2; --accent-fg:#06211e; --accent-soft:#143530;
  --crit:#ff8a80; --crit-soft:#3a1a18; --warn:#f0b35a; --warn-soft:#35280f; --ok:#7fd08c; --ok-soft:#17301d;
  --ghs:#f0605a; --ghs-bg:#111716; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent);text-underline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:0 28px;min-height:56px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--fg);padding-block:10px}
.brand .mark{width:13px;height:13px;border:2px solid var(--fg);border-radius:2px;transform:rotate(45deg);flex:none}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;align-self:stretch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{display:flex;align-items:center;padding:0 10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
form.lookup{display:flex;gap:6px;padding-block:10px}
form.lookup input{width:132px;font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase}
@media (max-width:820px){nav.tabs{order:3;flex-basis:100%;margin-inline:-10px}nav.tabs a{padding:10px}form.lookup{margin-left:auto}}
main{padding-block:36px 80px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.15;font-weight:600}
h1{font-size:30px;letter-spacing:-.025em} h2{font-size:16px;letter-spacing:-.01em} h3{font-size:15px;letter-spacing:-.005em}
.muted{color:var(--muted)} .sub{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.banner{padding:11px 14px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.stat{background:var(--surface);padding:18px 22px 20px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:32px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:4px}
.stat .v small{font-size:13px;color:var(--muted);letter-spacing:0;font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alerts li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:14px;padding:13px 0;border-top:1px solid var(--line);align-items:center}
.alerts li:first-child{border-top:0}
.alerts .bar{width:8px;height:8px;border-radius:50%}
.alerts .crit .bar{background:var(--crit)} .alerts .warn .bar{background:var(--warn)}
.alerts .t{font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-crit{color:var(--crit)} .p-warn{color:var(--warn)} .p-ok{color:var(--ok)} .p-mute{color:var(--muted)}
.chip{display:inline-block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:8px;font-weight:500}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:12px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;padding-block:10px}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td a{text-decoration:none;font-weight:500;color:var(--fg)} td a:hover{text-decoration:underline}
.ghsrow{display:inline-flex;gap:1px;flex-wrap:wrap}
.ghs{display:inline-flex;width:24px;height:24px}
.ghs svg{width:100%;height:100%}
.ghs-big{display:flex;flex-wrap:wrap;gap:8px 16px}
.ghs-big .item{display:flex;align-items:center;gap:6px;font-size:13px}
.ghs-big .ghs{width:38px;height:38px}
button,.btn{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 13px;min-height:34px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2;transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:var(--surface-2)}
button.primary,.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
button.primary:hover,.btn.primary:hover{background:color-mix(in srgb,var(--fg) 86%,var(--bg))}
button.danger{color:var(--crit)}
button.small,.btn.small{min-height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:34px;min-width:0;max-width:100%}
input[type=checkbox]{min-height:0;padding:0;accent-color:var(--fg)}
input[type=file]{padding:6px 10px;width:100%}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--fg) 25%,var(--line))}
textarea{width:100%;min-height:64px;padding:8px 10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
label.f input,label.f select{width:100%}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.checks label{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--fg)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:9px 24px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px} dl.kv dd{margin:0}
.hero{display:flex;flex-wrap:wrap;gap:18px 28px;justify-content:space-between;align-items:flex-start}
.code{font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.03em;border:1px solid var(--line);background:var(--surface);padding:2px 8px;border-radius:6px}
a[data-act="go-lab"]{color:var(--fg);text-decoration:none;font-weight:500}
a[data-act="go-lab"]:hover{text-decoration:underline}
.labcard h3{margin-bottom:2px}
.labcard ul{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.qrbox{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);display:inline-block;line-height:0}
.qrbox svg{width:210px;height:210px;max-width:100%}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
.drop{display:flex;flex-direction:column;gap:10px;border:1px dashed color-mix(in srgb,var(--fg) 22%,var(--line));border-radius:var(--r);padding:20px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.drop b{color:var(--fg);font-weight:600;font-size:14px}
/* Tlačová plocha pre PDF: vždy čierna na bielom, nezávisle od témy */
.pd{width:186mm;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:10pt;line-height:1.35}
.pd.pd-l{width:273mm}
.pd h1{font:bold 20pt Arial,Helvetica,sans-serif;margin:0 0 2mm;letter-spacing:0;color:#000}
.pd p{margin:0}
.pd .lab{font-size:15pt;font-weight:bold}
.pd .meta{font-size:9.5pt;color:#333;margin:1mm 0 6mm}
.pd table{width:100%;border-collapse:collapse;font-size:10pt}
.pd th,.pd td{border:1px solid #000;padding:1.6mm 2mm;text-align:left;vertical-align:top;background:#fff;color:#000}
.pd th{background:#eee;font-size:8.5pt;font-weight:bold;text-transform:uppercase;letter-spacing:.04em;white-space:normal}
.pd td.code{font-family:"Courier New",monospace;font-weight:bold;white-space:nowrap;font-size:11pt;border-radius:0;letter-spacing:0}
.pd .txt{font-size:11pt}
.pd .small{font-size:8.5pt;color:#333}
.pd td.num{text-align:right;white-space:nowrap}
.pd .g{display:inline-block;position:relative;width:9mm;height:9mm;vertical-align:middle;flex:none}
.pd .g i{position:absolute;left:17%;top:17%;width:66%;height:66%;border:0.6mm solid #d0261c;background:#fff;transform:rotate(45deg)}
.pd .g b{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:bold 7pt Arial,Helvetica,sans-serif;color:#000}
.pd .pict .g i{border-width:0.9mm}
.pd .pict .g b{font-size:11pt}
.pd .pict{display:flex;flex-wrap:wrap;gap:3mm 7mm;margin:0 0 6mm}
.pd .pict div{display:flex;align-items:center;gap:2mm;font-size:10.5pt;font-weight:bold}
.pd .pict .g{width:15mm;height:15mm}
.pd .sig{display:inline-block;border:2px solid #d0261c;color:#d0261c;font-weight:bold;font-size:13pt;padding:1mm 4mm;margin-bottom:5mm;text-transform:uppercase}
.pd .foot{margin-top:6mm;font-size:8.5pt;color:#333}
#scanPrev{max-height:180px;border-radius:8px;border:1px solid var(--line);align-self:flex-start}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg);padding:0;width:min(600px,calc(100% - 32px));max-height:calc(100% - 40px);box-shadow:0 30px 80px rgba(5,15,13,.22)}
dialog::backdrop{background:rgba(8,14,13,.38);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:18px 22px 6px}
dialog .dh h2{font-size:18px;letter-spacing:-.015em}
dialog .db{padding:14px 22px 20px;overflow:auto}
dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:50;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(5,15,13,.25)}
.ro .w{display:none!important}
.note{font-size:12.5px;color:var(--fg);background:var(--warn-soft);padding:9px 12px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>
/* Náhrada služieb Claude pre verziu so spoločnou databázou Supabase.
   - db:      tabuľky labs, chems, bottles, sds, log, config (id + data jsonb), zmeny cez Realtime
   - user:    prihlásenie e-mailovým kódom (OTP), oprávnenia z tabuľky members
   - assets:  PDF karty SDS v súkromnom buckete "sds", odkazy cez podpísané URL
   - offline: posledný stav sa drží v localStorage, bez siete sa dá sklad prezerať (nie meniť)
   Do klienta patrí len publishable kľúč. Prístup k dátam stráži Row Level Security v databáze.
   Aktivuje sa iba vtedy, keď stránka nebeží v Claude. */
(function(){
  if(window.claude)return;
  window.__standalone=true;
  const CFG=Object.assign({
    url:"https://dhxlqxsughvpyfsxzuqi.supabase.co",
    key:"sb_publishable_uMgmf7kh7_gUHgAnwt8fsw_15D1o1f3",
    bucket:"sds"
  },window.__SUPA||{});
  const CACHE="chemsklad-supa-v1:",COLLS=["labs","chems","bottles","sds","log","config"];
  const lsGet=k=>{try{return JSON.parse(localStorage.getItem(CACHE+k)||"null")}catch(e){return null}};
  const lsSet=(k,v)=>{try{localStorage.setItem(CACHE+k,JSON.stringify(v))}catch(e){}};
  const lsClear=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(CACHE)).forEach(k=>localStorage.removeItem(k))}catch(e){}};
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

  const lib=window.supabase&&window.supabase.createClient;
  const sb=lib?window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;

  /* ---------- Chyby v tvare, ktorý aplikácia pozná ---------- */
  const isNet=e=>!navigator.onLine||/fetch|network|Failed to fetch|Load failed/i.test(String(e&&(e.message||e)));
  const mapErr=e=>{
    if(!e)return {code:"unknown",message:"Neznáma chyba"};
    const c=String(e.code||"");
    if(c==="42501"||c==="PGRST301"||/row-level security|permission denied|JWT/i.test(e.message||""))return {code:"invalid_argument",message:"Nemáte oprávnenie na tento zápis."};
    if(c==="P0002")return {code:"not_found",message:"Záznam neexistuje"};
    if(c==="53100"||/read-only/i.test(e.message||""))return {code:"quota_exceeded",message:"Databáza je plná alebo len na čítanie."};
    if(isNet(e))return {code:"unavailable",message:"Bez pripojenia k internetu. Zápis nie je možný."};
    return {code:c||"unknown",message:e.message||String(e)};
  };

  /* ---------- Prihlásenie ---------- */
  let me=null;           // {email,name,role}
  let members={};        // email -> {name,role}
  let offline=false;
  let needAuth=false;    // spustené offline bez platného prihlásenia – po návrate siete treba stránku načítať znova
  const offlineStart=()=>{me=lsGet("me");members=lsGet("members")||{};offline=true;needAuth=true};

  function loginScreen(msg){
    return new Promise(resolve=>{
      const w=document.createElement("div");w.id="__login";
      w.style.cssText="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg,#f8f9f9);color:var(--fg,#1c1c1e);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif";
      w.innerHTML=`<form style="width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:14px;background:var(--card,#fff);box-shadow:0 8px 30px rgba(0,0,0,.08)" novalidate>
        <h1 style="margin:0;font-size:20px">Chemický sklad OPAF</h1>
        <p style="margin:0;opacity:.75" data-k="info">Prihláste sa univerzitným e-mailom. Pošleme vám jednorazový kód.</p>
        <label style="display:flex;flex-direction:column;gap:4px">E-mail<input name="email" type="email" autocomplete="email" required style="font:inherit;padding:10px;border:1px solid #c9cccc;border-radius:8px"></label>
        <label data-k="codeRow" style="display:none;flex-direction:column;gap:4px">Kód z e-mailu<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" style="font:inherit;padding:10px;border:1px solid #c9cccc;border-radius:8px;letter-spacing:.2em"></label>
        <button type="submit" style="font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:#0b5d55;color:#fff;cursor:pointer" data-k="btn">Poslať kód</button>
        <button type="button" data-k="back" style="display:none;font:inherit;padding:6px;border:0;background:none;color:#0b5d55;cursor:pointer">Zmeniť e-mail</button>
        <p role="status" data-k="msg" style="margin:0;min-height:1.4em;color:#a1261b">${esc(msg||"")}</p>
      </form>`;
      document.body.appendChild(w);
      const f=w.querySelector("form"),q=k=>w.querySelector(`[data-k="${k}"]`);
      let stage="email",email="";
      const toCode=()=>{stage="code";q("codeRow").style.display="flex";q("back").style.display="block";f.email.disabled=true;q("btn").textContent="Prihlásiť";q("info").textContent=`Kód sme poslali na ${email}. Platí obmedzený čas. Ak prišiel odkaz, stačí ho otvoriť v tomto prehliadači.`;setTimeout(()=>f.code.focus(),0)};
      q("back").onclick=()=>{stage="email";q("codeRow").style.display="none";q("back").style.display="none";f.email.disabled=false;q("btn").textContent="Poslať kód";q("msg").textContent=""};
      f.onsubmit=async e=>{e.preventDefault();q("msg").textContent="";q("btn").disabled=true;
        try{
          if(stage==="email"){
            email=String(f.email.value).trim().toLowerCase();
            if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){q("msg").textContent="Zadajte platný e-mail.";return}
            const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.href.split("#")[0]}});
            if(error)throw error;toCode();
          }else{
            const token=String(f.code.value).replace(/\s/g,"");
            const {data,error}=await sb.auth.verifyOtp({email,token,type:"email"});
            if(error)throw error;w.remove();resolve(data.session);
          }
        }catch(err){
          const m=String(err&&err.message||err);
          q("msg").textContent=/not authorized|nemá prístup|403|signups not allowed/i.test(m)?"Tento e-mail nemá prístup do skladu. Požiadajte správcu o pridanie."
            :/rate limit|429|security purposes/i.test(m)?"Príliš veľa pokusov. Skúste to o chvíľu znova."
            :/expired|invalid/i.test(m)?"Kód je neplatný alebo vypršal."
            :isNet(err)?"Bez pripojenia k internetu.":m;
        }finally{q("btn").disabled=false}
      };
      sb.auth.onAuthStateChange((ev,s)=>{if(s&&document.getElementById("__login")){w.remove();resolve(s)}});
      setTimeout(()=>f.email.focus(),0);
    });
  }

  async function loadMe(session){
    const email=String(session.user.email||"").toLowerCase();
    const {data,error}=await sb.from("members").select("email,name,role");
    if(error)throw error;
    members=Object.fromEntries((data||[]).map(m=>[m.email,m]));
    const m=members[email];
    if(!m)return null;
    me={email,name:m.name||email,role:m.role};
    lsSet("me",me);lsSet("members",members);
    return me;
  }

  const ready=(async()=>{
    if(!sb){ /* knižnica sa nenačítala – len offline z vyrovnávacej pamäte */
      if(!lsGet("me"))throw {code:"unavailable",message:"Bez pripojenia sa nedá prihlásiť."};
      offlineStart();return;
    }
    if(document.readyState==="loading")await new Promise(r=>document.addEventListener("DOMContentLoaded",r,{once:true}));
    let session=null;
    try{session=(await sb.auth.getSession()).data.session}catch(e){}
    if(!navigator.onLine&&lsGet("me")){
      if(session){me=lsGet("me");members=lsGet("members")||{};offline=true}else offlineStart();
      return;
    }
    let msg="";
    for(;;){
      if(!session)session=await loginScreen(msg);
      try{
        if(await loadMe(session))return;
        msg="Účet "+session.user.email+" nie je medzi členmi skladu. Požiadajte správcu o pridanie.";
        await sb.auth.signOut();lsClear();session=null;
      }catch(e){
        if(isNet(e)&&lsGet("me")){offlineStart();return}
        msg=mapErr(e).message;session=null;
      }
    }
  })();

  /* ---------- Databáza ---------- */
  const state={}; // k -> {map, loaded, fromCache, subs:Set, ch, lim}
  const LOG_LIMIT=300;
  function st(k){
    if(state[k])return state[k];
    const c=lsGet("c:"+k);
    const s=state[k]={map:c?c.map:{},hasCache:!!c,loaded:false,subs:new Set(),ch:null,fetching:null};
    return s;
  }
  let saveT={};
  const persist=k=>{clearTimeout(saveT[k]);saveT[k]=setTimeout(()=>lsSet("c:"+k,{map:state[k].map,at:Date.now()}),300)};
  const emit=k=>{const s=state[k];if(!s)return;s.subs.forEach(f=>{try{f()}catch(e){console.error(e)}})};

  async function fetchAll(k){
    const s=st(k);
    if(s.fetching)return s.fetching;
    s.fetching=(async()=>{
      try{
        const map={};
        if(k==="log"){
          const {data,error}=await sb.from("log").select("id,data").order("data->>at",{ascending:false}).limit(LOG_LIMIT);
          if(error)throw error;(data||[]).forEach(r=>map[r.id]=r.data);
        }else{
          for(let from=0;;from+=1000){
            const {data,error}=await sb.from(k).select("id,data").range(from,from+999);
            if(error)throw error;(data||[]).forEach(r=>map[r.id]=r.data);
            if(!data||data.length<1000)break;
          }
        }
        s.map=map;s.loaded=true;offline=false;persist(k);emit(k);if(k==="sds")signAll();
      }catch(e){
        if(isNet(e))offline=true;else console.warn("Načítanie "+k+" zlyhalo",e);
        s.loaded=false;s.err=e;emit(k);
      }finally{s.fetching=null;bar()}
    })();
    return s.fetching;
  }
  function watch(k){
    const s=st(k);if(s.ch||!sb||!sb.realtime)return;
    let first=true;
    s.ch=sb.channel("db-"+k).on("postgres_changes",{event:"*",schema:"public",table:k},p=>{
      if(p.eventType==="DELETE"){const id=p.old&&p.old.id;if(id)delete s.map[id]}
      else if(p.new&&p.new.id){s.map[p.new.id]=p.new.data}
      persist(k);emit(k);if(k==="sds")signAll();
    }).subscribe(status=>{
      if(status==="SUBSCRIBED"){if(!first)fetchAll(k);first=false} /* po výpadku spojenia dotiahnuť zmeškané zmeny */
    });
  }
  const refreshAll=()=>{if(!sb||!me||needAuth)return;Object.keys(state).forEach(k=>{if(state[k].subs.size){fetchAll(k);watch(k)}})};
  addEventListener("online",()=>{if(needAuth){location.reload();return}offline=false;refreshAll();signAll();bar()});
  addEventListener("offline",()=>{offline=true;bar()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshAll()});

  function listen(k,fn,onErr){
    const s=st(k);
    const f=()=>{if(s.loaded||s.hasCache)fn();else if(s.err&&onErr)onErr(mapErr(s.err))};
    s.subs.add(f);
    ready.then(()=>{
      if(s.hasCache)f();
      if(sb&&!offline){fetchAll(k);watch(k)}else if(!s.hasCache&&onErr)onErr({code:"unavailable",message:"Bez pripojenia"});
    },e=>onErr&&onErr(mapErr(e)));
    return ()=>s.subs.delete(f);
  }

  const patchCfg=(id,v)=>{ /* QR kódy majú odkazovať na túto PWA, ak správca nezadal inú adresu */
    if(id!=="app"||!v)return v;
    if(!v.baseUrl||/claude\.ai/.test(v.baseUrl))v.baseUrl=location.href.split("#")[0].split("?")[0];
    return v;
  };
  function query(k,ord,lim){
    const snap=()=>{const s=st(k);
      let docs=Object.entries(s.map).map(([id,v])=>{const d=k==="config"?patchCfg(id,clone(v)):clone(v);return {id,exists:true,data:()=>clone(d)}});
      if(ord){const [f,dir]=ord,m=dir==="desc"?-1:1;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return (x<y?-1:x>y?1:0)*m})}
      if(lim)docs=docs.slice(0,lim);
      return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:!s.loaded}}};
    return {
      orderBy:(f,dir)=>query(k,[f,dir||"asc"],lim),
      limit:n=>query(k,ord,n),
      doc:id=>docRef(k+"/"+id),
      get:async()=>{await ready;await fetchAll(k);return snap()},
      onSnapshot:(cb,onErr)=>listen(k,()=>cb(snap()),onErr)
    };
  }
  const guard=async()=>{await ready;if(!sb||needAuth||!navigator.onLine)throw {code:"unavailable",message:"Bez pripojenia k internetu. Zápis nie je možný."}};
  function docRef(path){
    const [k,id]=path.split("/");
    const snap=()=>{const s=st(k),v=s.map[id];return {id,exists:v!==undefined,data:()=>k==="config"?patchCfg(id,clone(v)):clone(v),metadata:{fromCache:!s.loaded}}};
    return {
      set:async d=>{await guard();const data=clone(d)||{};
        const r=k==="log"?await sb.from(k).insert({id,data}):await sb.from(k).upsert({id,data},{onConflict:"id"});
        if(r.error)throw mapErr(r.error);st(k).map[id]=data;persist(k);emit(k)},
      update:async d=>{await guard();
        const {data,error}=await sb.rpc("doc_update",{p_table:k,p_id:id,p_patch:clone(d)||{}});
        if(error)throw mapErr(error);st(k).map[id]=data;persist(k);emit(k)},
      delete:async()=>{await guard();const {error}=await sb.from(k).delete().eq("id",id);
        if(error)throw mapErr(error);delete st(k).map[id];persist(k);emit(k)},
      get:async()=>{await ready;await fetchAll(k);return snap()},
      onSnapshot:(cb,onErr)=>listen(k,()=>cb(snap()),onErr)
    };
  }
  const db={collection:k=>query(k),doc:p=>docRef(p)};

  /* ---------- PDF karty SDS (súkromný bucket, podpísané URL) ---------- */
  const SIGN_TTL=3600;
  let signed=lsGet("signed")||{}; // path -> {url, exp}
  let signT=null;
  async function signAll(){
    if(!sb||offline)return;
    const paths=[...new Set(Object.values(st("sds").map).map(s=>s&&s.asset).filter(Boolean))]
      .filter(p=>!signed[p]||signed[p].exp-Date.now()<10*60e3);
    if(!paths.length)return;
    const {data,error}=await sb.storage.from(CFG.bucket).createSignedUrls(paths,SIGN_TTL);
    if(error){console.warn("Podpis PDF zlyhal",error);return}
    const exp=Date.now()+SIGN_TTL*1000;
    (data||[]).forEach(r=>{if(r.signedUrl&&r.path)signed[r.path]={url:r.signedUrl,exp}});
    lsSet("signed",signed);emit("sds");
    clearTimeout(signT);signT=setTimeout(signAll,(SIGN_TTL-15*60)*1000);
    prefetchPdfs();
  }
  /* Kópia PDF v IndexedDB, aby sa karty SDS dali otvoriť aj bez internetu.
     Súbory sa nikdy neprepisujú (náhodný názov, upsert vypnutý), takže uložená kópia je vždy aktuálna. */
  const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("chemsklad-supa-pdf",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const idbDo=(mode,fn)=>idb().then(d=>new Promise((res,rej)=>{const t=d.transaction("f",mode),r=fn(t.objectStore("f"));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}));
  let prefetching=false;
  async function prefetchPdfs(){
    if(prefetching||offline)return;prefetching=true;
    try{
      const have=new Set(await idbDo("readonly",s=>s.getAllKeys())||[]);
      for(const [p,s] of Object.entries(signed)){
        if(have.has(p)||!s.url)continue;
        const r=await fetch(s.url);if(!r.ok)continue;
        const b=await r.blob();await idbDo("readwrite",st=>st.put(b,p));
      }
    }catch(e){}finally{prefetching=false}
  }
  /* Online: platný podpísaný odkaz. Inak stabilný odkaz na túto stránku (?sds=…), ktorá si podpis
     vyžiada pri otvorení, alebo bez internetu zobrazí uloženú kópiu. */
  window.__assetHref=id=>{
    const s=signed[id];
    if(s&&navigator.onLine&&!offline&&s.exp-Date.now()>5*60e3)return s.url;
    return location.href.split("#")[0].split("?")[0]+"?sds="+encodeURIComponent(id);
  };
  const want=new URLSearchParams(location.search).get("sds");
  if(want){
    const show=t=>{let el=document.getElementById("__sdsOpen");if(!el){document.body.insertAdjacentHTML("beforeend",'<div id="__sdsOpen" style="position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;background:var(--bg,#fff);font:16px system-ui,sans-serif"></div>');el=document.getElementById("__sdsOpen")}el.textContent=t};
    const fromCache=async()=>{const b=await idbDo("readonly",s=>s.get(want)).catch(()=>null);if(b){location.replace(URL.createObjectURL(new Blob([b],{type:"application/pdf"})));return true}return false};
    ready.then(async()=>{
      show("Otváram kartu SDS…");
      try{
        if(!sb||offline||!navigator.onLine){if(await fromCache())return;throw new Error("offline")}
        const {data,error}=await sb.storage.from(CFG.bucket).createSignedUrl(want,SIGN_TTL);
        if(error)throw error;location.replace(data.signedUrl);
      }catch(e){
        if(isNet(e)&&await fromCache())return;
        show(isNet(e)||String(e.message)==="offline"?"Táto karta SDS nie je uložená v zariadení a bez internetu sa nedá otvoriť.":"Kartu SDS sa nepodarilo otvoriť (súbor chýba alebo nemáte prístup).");
      }
    },()=>{});
  }
  const assets={
    upload:async(file)=>{await guard();
      const type=file.type||"application/pdf";
      if(type!=="application/pdf")throw {code:"invalid_argument",message:"Nahrať sa dá len PDF."};
      const path=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))+".pdf";
      const {error}=await sb.storage.from(CFG.bucket).upload(path,file,{contentType:"application/pdf",upsert:false,cacheControl:"31536000"});
      if(error)throw mapErr(error);
      idbDo("readwrite",s=>s.put(file,path)).catch(()=>{});
      return {id:path};
    },
    delete:async id=>{await guard();const {error}=await sb.storage.from(CFG.bucket).remove([id]);if(error)throw mapErr(error);
      delete signed[id];lsSet("signed",signed);idbDo("readwrite",s=>s.delete(id)).catch(()=>{})}
  };

  /* ---------- Sťahovanie súborov a tlač (rovnaké ako v lokálnej ukážke) ---------- */
  const MIME={pdf:"application/pdf",csv:"text/csv;charset=utf-8",html:"text/html;charset=utf-8",json:"application/json",txt:"text/plain;charset=utf-8"};
  const downloads={save:async({filename,data})=>{
    const ext=String(filename).split(".").pop().toLowerCase();
    const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||"application/octet-stream"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);return {status:"saved"}}};
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  window.__printPdf=(blob,name)=>{
    if(mobile){
      const file=new File([blob],(name||"zostava")+".pdf",{type:"application/pdf"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name||"Zostava"}).catch(e=>{if(e&&e.name!=="AbortError")downloads.save({filename:file.name,data:blob})});
        return "Otváram ponuku Zdieľať – zvoľte Tlačiť. Ak sa neotvorí, PDF sa stiahne.";
      }
      downloads.save({filename:file.name,data:blob});return "PDF je stiahnuté, otvorte ho a zvoľte Tlačiť.";
    }
    const old=document.getElementById("__printFrame");if(old)old.remove();
    const f=document.createElement("iframe");f.id="__printFrame";f.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
    f.src=URL.createObjectURL(new Blob([blob],{type:"application/pdf"}));
    f.onload=()=>setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(f.src,"_blank")}},300);
    document.body.appendChild(f);
    return "Otváram dialóg tlače…";
  };

  /* ---------- Používateľ ---------- */
  const user={
    me:async()=>{await ready;return {id:me.email,name:me.name,canEdit:me.role==="admin"}},
    can:async()=>{await ready;return !!me}
  };
  const sample={limits:async()=>({images:false}),json:async()=>{throw {code:"standalone",message:"Mimo Claude nedostupné"}}};
  const caps={db,user,assets,sample,downloads};
  window.claude={use:async n=>{if(n==="db"){try{await ready}catch(e){return null}}return caps[n]||null}};

  /* Mená v histórii (aplikácia vypisuje <span data-uid="e-mail">…</span>) */
  const fillNames=()=>document.querySelectorAll("span[data-uid]").forEach(el=>{const m=members[el.dataset.uid];const t=m&&m.name?m.name:el.dataset.uid;if(el.textContent!==t)el.textContent=t});
  let nameT=0;new MutationObserver(()=>{if(!nameT)nameT=requestAnimationFrame(()=>{nameT=0;fillNames()})}).observe(document.documentElement,{childList:true,subtree:true});

  /* ---------- Lišta: kto je prihlásený, stav spojenia, odhlásenie ---------- */
  function bar(){
    if(!me||!document.body)return;
    let b=document.getElementById("__supaBar");
    if(!b){b=document.createElement("div");b.id="__supaBar";
      b.style.cssText="position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;gap:10px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;padding:7px 8px 7px 14px;border-radius:999px;white-space:nowrap;background:#1c1c1e;color:#f5f5f7;font:12.5px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.18)";
      b.innerHTML='<span data-k="dot" style="width:8px;height:8px;border-radius:50%;flex:none"></span><span data-k="who" style="overflow:hidden;text-overflow:ellipsis"></span><button type="button" style="all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;background:#3a3a3c">Odhlásiť</button>';
      b.querySelector("button").onclick=async()=>{if(!confirm("Odhlásiť sa z Chemického skladu? Uložené údaje sa z tohto zariadenia vymažú."))return;
        try{sb&&await sb.auth.signOut()}catch(e){}lsClear();try{indexedDB.deleteDatabase("chemsklad-supa-pdf")}catch(e){}location.hash="";location.reload()};
      document.body.appendChild(b)}
    const off=offline||!navigator.onLine;
    b.querySelector('[data-k="dot"]').style.background=off?"#ff9f0a":"#30d158";
    const who=b.querySelector('[data-k="who"]');
    who.textContent=(off?"Offline · len prezeranie · ":"")+me.name;
    who.title=me.email+(me.role==="admin"?" (správca)":"")+(off?" – bez pripojenia, zmeny sa neuložia":" – spoločná databáza oddelenia");
  }
  ready.then(()=>{if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",bar);else bar()},()=>{});
})();

</script>
<script>
/* Rozpoznávanie štítka bez Claude (len samostatná verzia):
   1. kód GS1 (DataMatrix/QR) → šarža, exspirácia, GTIN
   2. CAS číslo → z ručne zadaného textu, z kódu alebo OCR z fotky (Tesseract.js), overené kontrolnou číslicou
   3. PubChem → názov, vzorec, piktogramy, signálne slovo, H-vety
      (prednostne harmonizovaná klasifikácia EÚ podľa nariadenia 1272/2008, inak súhrn oznámení ECHA C&L) */
(function(){
  if(!window.__standalone)return;
  const PC="https://pubchem.ncbi.nlm.nih.gov/rest";
  const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";

  /* ---------- CAS ---------- */
  const casOk=c=>{const m=/^(\d{2,7})-(\d{2})-(\d)$/.exec(c);if(!m)return false;
    const ds=(m[1]+m[2]).split("").reverse();let s=0;ds.forEach((d,i)=>s+=(i+1)*+d);return s%10===+m[3]};
  const fixOcr=s=>s.replace(/[Oo]/g,"0").replace(/[Il|]/g,"1").replace(/S/g,"5").replace(/B/g,"8");
  function findCas(text){
    if(!text)return [];
    const re=/(?<![\dA-Za-z])([\dOoIlSB]{2,7})\s?[-–—~]\s?([\dOoIlSB]{2})\s?[-–—~]\s?([\dOoIlSB])(?![\dA-Za-z])/g;
    const out=[];let m;
    while((m=re.exec(text))){
      const c=fixOcr(m[1])+"-"+fixOcr(m[2])+"-"+fixOcr(m[3]);
      if(!/^\d+-\d+-\d$/.test(c)||!casOk(c)||/^0/.test(c))continue;
      const near=/CAS/i.test(text.slice(Math.max(0,m.index-30),m.index));
      if(!out.some(o=>o.cas===c))out.push({cas:c,near});
    }
    return out.sort((a,b)=>b.near-a.near);
  }

  /* ---------- GS1 (DataMatrix / QR / GS1 Digital Link) ---------- */
  const yymmdd=s=>{if(!/^\d{6}$/.test(s))return "";let y=2000+ +s.slice(0,2),mo=+s.slice(2,4),d=+s.slice(4,6);
    if(mo<1||mo>12)return "";if(!d)d=new Date(y,mo,0).getDate();return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`};
  const SUPPLIERS=[[/sigma|aldrich|merck|milliporesigma/i,"Merck (Sigma-Aldrich)"],[/thermofisher|fishersci|alfa|acros/i,"Thermo Fisher Scientific"],[/carlroth/i,"Carl Roth"],[/vwr|avantor/i,"VWR (Avantor)"],[/lach-?ner/i,"Lach-Ner"],[/centralchem/i,"Centralchem"],[/honeywell|fluka|riedel/i,"Honeywell"],[/tci/i,"TCI"],[/penta/i,"PENTA"]];
  function parseCode(raw){
    const o={};const s=String(raw||"").trim();if(!s)return o;
    for(const [re,n] of SUPPLIERS)if(re.test(s)){o.supplier=n;break}
    try{const u=new URL(s);const p=u.pathname.split("/").filter(Boolean);
      for(let i=0;i<p.length-1;i++){if(p[i]==="01"&&/^\d{8,14}$/.test(p[i+1]))o.gtin=p[i+1];if(p[i]==="10")o.lot=decodeURIComponent(p[i+1])}
      const e=u.searchParams.get("17");if(e)o.expiry=yymmdd(e);return o}catch(e){}
    const set=(ai,v)=>{v=String(v).trim();if(ai==="01")o.gtin=v;else if(ai==="10")o.lot=v;else if(ai==="17")o.expiry=yymmdd(v);else if(ai==="240")o.catalog=v};
    let t=s.replace(/^\](d2|Q3|C1|e0)/,"");
    if(/\(\d{2,4}\)/.test(t)){const re=/\((\d{2,4})\)([^(]*)/g;let m;while((m=re.exec(t)))set(m[1],m[2])}
    else if(/^\x1d?01\d{14}/.test(t)){
      t=t.replace(/^\x1d/,"");let i=0;const GS="\x1d";
      while(i<t.length){const a2=t.substr(i,2),a3=t.substr(i,3);
        if(a2==="01"){set("01",t.substr(i+2,14));i+=16}
        else if(["11","15","17"].includes(a2)){set(a2,t.substr(i+2,6));i+=8}
        else if(a2==="10"||a2==="21"||a3==="240"){const n=a3==="240"?3:2;let j=t.indexOf(GS,i+n);if(j<0)j=t.length;set(a3==="240"?"240":a2,t.slice(i+n,j));i=j+1}
        else break}
    }
    return o;
  }

  /* ---------- OCR ---------- */
  let tessP=null,workerP=null;
  const loadTess=()=>tessP=tessP||new Promise((res,rej)=>{if(window.Tesseract)return res(window.Tesseract);
    const s=document.createElement("script");s.src=TESS;s.onload=()=>res(window.Tesseract);s.onerror=()=>{tessP=null;rej(new Error("ocr_load"))};document.head.appendChild(s)});
  async function rotated(bmp,deg){
    const c=document.createElement("canvas"),sw=deg%180!==0;c.width=sw?bmp.height:bmp.width;c.height=sw?bmp.width:bmp.height;
    const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.4)";x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(bmp,-bmp.width/2,-bmp.height/2);return c}
  async function ocrCas(blob,status){
    const T=await loadTess();
    workerP=workerP||T.createWorker("eng");const w=await workerP;
    const bmp=await createImageBitmap(blob);let all="";
    for(const deg of [0,90,270,180]){
      status(`Čítam text štítka${deg?` (otočené o ${deg}°)`:""}…`);
      const {data}=await w.recognize(await rotated(bmp,deg));all+="\n"+(data.text||"");
      const f=findCas(data.text);if(f.length)return {list:f,text:all};
    }
    return {list:[],text:all};
  }

  /* ---------- PubChem ---------- */
  const getJ=async u=>{const r=await fetch(u);if(r.status===404)return null;if(!r.ok)throw new Error("http "+r.status);return r.json()};
  const pictoFromH=hs=>{const g=new Set(),h=c=>hs.some(x=>x.startsWith(c));const any=l=>l.some(h);
    if(any(["H200","H201","H202","H203","H204","H240","H241"]))g.add("GHS01");
    if(any(["H220","H221","H222","H223","H224","H225","H226","H228","H241","H242","H250","H251","H252","H260","H261"]))g.add("GHS02");
    if(any(["H270","H271","H272"]))g.add("GHS03");if(any(["H280","H281"]))g.add("GHS04");
    if(any(["H290","H314","H318"]))g.add("GHS05");if(any(["H300","H301","H310","H311","H330","H331"]))g.add("GHS06");
    if(any(["H304","H334","H340","H341","H350","H351","H360","H361","H370","H371","H372","H373"]))g.add("GHS08");
    if(any(["H400","H410","H411"]))g.add("GHS09");
    const g7=["H302","H312","H332","H317","H335","H336","H420"].filter(h).length,irr=["H315","H319"].filter(h).length;
    if(!g.has("GHS06")&&(g7||(irr&&!g.has("GHS05"))))g.add("GHS07");
    return [...g].sort()};
  function pickGhs(view){
    const rec=view&&view.Record;if(!rec)return null;
    const refs={};(rec.Reference||[]).forEach(r=>refs[r.ReferenceNumber]=r.SourceName||"");
    const by={};
    (function walk(s){(s.Information||[]).forEach(i=>{const k=i.ReferenceNumber;(by[k]=by[k]||{src:refs[k]||"",items:[]}).items.push(i)});(s.Section||[]).forEach(walk)})(rec);
    const groups=Object.values(by);
    const harm=groups.find(g=>/1272\/2008/.test(g.src)&&g.items.some(i=>i.Name==="GHS Hazard Statements"));
    const echa=groups.find(g=>/European Chemicals Agency/i.test(g.src)&&g.items.some(i=>i.Name==="GHS Hazard Statements"));
    const g=harm||echa;if(!g)return null;
    const stm=[],pics=[];
    for(const i of g.items){const sw=(i.Value&&i.Value.StringWithMarkup)||[];
      if(i.Name==="GHS Hazard Statements")sw.forEach(x=>{const m=/^(EUH\d{3}|H\d{3}[A-Za-z]{0,3})\s*(?:\(([^)]*)\))?:/.exec(x.String||"");if(!m)return;
        const pct=m[2]?parseFloat(m[2].replace(/[^\d.]/g,"")):100;stm.push({code:m[1],pct,danger:/\[Danger/.test(x.String)})});
      if(i.Name==="Pictogram(s)")sw.forEach(x=>(x.Markup||[]).forEach(mk=>{const p=/(GHS0\d)\.svg/.exec(mk.URL||"");if(p)pics.push(p[1])}))}
    const sel=harm?stm:stm.filter(s=>s.pct>=50);
    const codes=[...new Set(sel.map(s=>s.code))];
    return {source:harm?"harm":"echa",codes,ghs:harm&&pics.length?[...new Set(pics)].sort():pictoFromH(codes),
      signal:sel.some(s=>s.danger)?"Nebezpečenstvo":codes.length?"Pozor":""};
  }
  async function pubchem(q,status){
    status(`Hľadám ${q} v databáze PubChem…`);
    const ids=await getJ(`${PC}/pug/compound/name/${encodeURIComponent(q)}/cids/JSON`);
    const cid=ids&&ids.IdentifierList&&ids.IdentifierList.CID&&ids.IdentifierList.CID[0];if(!cid)return null;
    const [pr,view]=await Promise.all([getJ(`${PC}/pug/compound/cid/${cid}/property/MolecularFormula,Title/JSON`),
      getJ(`${PC}/pug_view/data/compound/${cid}/JSON?heading=GHS+Classification`).catch(()=>null)]);
    const p=pr&&pr.PropertyTable&&pr.PropertyTable.Properties[0]||{};
    return {cid,name:p.Title||"",formula:p.MolecularFormula||"",ghs:pickGhs(view)};
  }

  /* ---------- Hlavná funkcia volaná aplikáciou ---------- */
  window.__labelRecognizer=async({code,image,known,status})=>{
    const codeInfo=parseCode(code);
    let cands=findCas(code),casFrom=cands.length?"zadané alebo prečítané z kódu":"";
    if(!cands.length&&image){
      try{const r=await ocrCas(image,status);cands=r.list;if(cands.length)casFrom="prečítané z fotky štítka (OCR)"}
      catch(e){status("Knižnicu na čítanie textu sa nepodarilo načítať, skontrolujte pripojenie na internet.")}
    }
    const base={lot:codeInfo.lot||"",expiry:codeInfo.expiry||"",supplier:codeInfo.supplier||"",catalog:codeInfo.catalog||(codeInfo.gtin?"GTIN "+codeInfo.gtin:""),qty:null,unit:"",peroxide:false};
    const cas=cands[0]&&cands[0].cas;
    if(cas&&known&&known(cas))return {found:true,cas,name:"",...base};
    let q=cas;
    if(!q){const t=String(code||"").split("\n").map(s=>s.trim()).find(s=>s&&!/^https?:/i.test(s)&&!/^\x1d?01\d{14}/.test(s)&&!/^\(\d{2}\)/.test(s)&&s.length<80);
      if(t&&/[a-z]{3}/i.test(t)){q=t;casFrom=""}}
    if(!q)return {found:false,reason:image?"Na fotke som nenašiel CAS číslo. Odfoťte štítok zblízka, rovno a ostro tak, aby bolo CAS čitateľné, alebo ho napíšte do poľa nižšie (napr. 67-64-1).":"Zadajte CAS číslo (napr. 67-64-1) alebo anglický názov látky."};
    let pc=null;
    try{pc=await pubchem(q,status)}catch(e){
      if(cas)return {found:true,cas,name:"",...base,ghs:[],hazards:"",signal:"",confidence:"low",
        sourceNote:`CAS ${cas} ${casFrom}. Databáza PubChem nie je dostupná (chýba internet?), názov, piktogramy a H-vety doplňte podľa SDS.`};
      return {found:false,reason:"Databáza PubChem nie je dostupná. Skontrolujte pripojenie na internet."}}
    if(!pc)return {found:false,reason:cas?`CAS ${cas} (${casFrom}) sa v databáze PubChem nenašlo. Skontrolujte číslo na štítku alebo pridajte chemikáliu ručne.`:`„${q}“ sa v databáze PubChem nenašlo. Skúste CAS číslo alebo anglický názov.`};
    const g=pc.ghs;
    const src=!g?"PubChem pre túto látku neuvádza klasifikáciu podľa EÚ, piktogramy a H-vety doplňte zo SDS."
      :g.source==="harm"?"Piktogramy, signálne slovo a H-vety sú z harmonizovanej klasifikácie EÚ (príloha VI nariadenia CLP 1272/2008) v databáze PubChem. Doplnkové vety EUH a ďalšie triedy nebezpečnosti, ktoré uvádza dodávateľ, porovnajte so SDS."
      :"Harmonizovaná klasifikácia EÚ pre túto látku nie je. Piktogramy a H-vety sú zo súhrnu oznámení v databáze ECHA C&L (uvedené aspoň v polovici oznámení), preto ich porovnajte so štítkom alebo SDS.";
    const casTxt=cas?`CAS ${cas} ${casFrom}${casFrom.includes("OCR")?" – skontrolujte, či sedí so štítkom":""}${cands.length>1?` (na štítku boli aj ${cands.slice(1).map(c=>c.cas).join(", ")})`:""}. `:`Vyhľadané podľa názvu „${q}“. `;
    return {found:true,name:pc.name,cas:cas||"",formula:pc.formula,ghs:g?g.ghs:[],signal:g?g.signal:"",hazards:g?g.codes.join(", "):"",
      ...base,hazardSource:"pubchem",confidence:cas&&g&&g.source==="harm"&&!casFrom.includes("OCR")?"high":"medium",
      sourceNote:`Rozpoznané bez Claude. ${casTxt}Názov a vzorec sú z databázy PubChem (názov je anglický, prepíšte ho do slovenčiny). ${src}`};
  };
  window.__labelRecognizer.tests={casOk,findCas,parseCode,pickGhs,pictoFromH};
})();

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
"use strict";
const GHS={GHS01:"Výbušné",GHS02:"Horľavé",GHS03:"Oxidujúce",GHS04:"Plyn pod tlakom",GHS05:"Žieravé",GHS06:"Akútna toxicita",GHS07:"Dráždivé / škodlivé",GHS08:"Nebezpečné pre zdravie",GHS09:"Nebezpečné pre životné prostredie"};
const LANGS={sk:"slovenčina",cs:"čeština",en:"angličtina",de:"nemčina",x:"iný"};
const DEF_CFG={baseUrl:"",sdsMaxYears:3,peroxideMonths:6,expiryWarnDays:30};
const S={labs:{},chems:{},bottles:{},sds:{},log:[],config:{...DEF_CFG},got:{},stale:false,me:null,canWrite:null,canEdit:false,noRuntime:false};
const UI={lab:"",q:"",status:"active",chemQ:"",last:"sklad"};
let db=null,user=null,assets=null,sample=null,downloads=null;

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nid=(n=6)=>{const a="abcdefghjkmnpqrstuvwxyz23456789";let s="";for(const x of crypto.getRandomValues(new Uint8Array(n)))s+=a[x%a.length];return s};
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const d0=s=>s?new Date(String(s).slice(0,10)+"T00:00:00"):null;
const days=s=>{const d=d0(s);return d?Math.round((d-d0(todayISO()))/864e5):null};
const fmtD=s=>{if(!s)return "—";const [y,m,d]=String(s).slice(0,10).split("-");return `${+d}. ${+m}. ${y}`};
const fmtDT=iso=>{try{return new Date(iso).toLocaleString("sk-SK",{day:"numeric",month:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}};
const UNITS={mg:["m",.001],g:["m",1],kg:["m",1000],ml:["v",1],l:["v",1000],ks:["n",1]};
const conv=(q,f,t)=>{const a=UNITS[f],b=UNITS[t];if(!a||!b||a[0]!==b[0])return q;return q*a[1]/b[1]};
const fmtQ=(q,u)=>`${(Math.round((+q||0)*100)/100).toLocaleString("sk-SK")} ${esc(u||"")}`;
const codeOf=id=>"OPAF-"+String(id).toUpperCase();
const safeUrl=u=>/^https:\/\//i.test(u||"")?u:"";

const labList=()=>Object.values(S.labs).sort((a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(b.name,"sk"));
const chemList=()=>Object.values(S.chems).sort((a,b)=>String(a.name).localeCompare(b.name,"sk"));
const active=b=>b.status!=="empty";
const bottlesOf=cid=>Object.values(S.bottles).filter(b=>b.chem===cid);
const sdsOf=cid=>Object.values(S.sds).filter(s=>s.chem===cid).sort((a,b)=>String(b.revision||"").localeCompare(a.revision||""));
const total=c=>bottlesOf(c.id).filter(active).reduce((s,b)=>s+conv(+b.qty||0,b.unit,c.unit||b.unit),0);
const labName=id=>S.labs[id]?.name||"Neznáme laboratórium";
const chemName=id=>S.chems[id]?.name||"Neznáma chemikália";
const sdsHref=s=>s.asset?(window.__assetHref?window.__assetHref(s.asset):"/_blob/"+encodeURIComponent(s.asset)):safeUrl(s.url);

function ghsIcon(g,big){return `<span class="ghs" title="${esc(g)} – ${esc(GHS[g]||"")}" role="img" aria-label="${esc(g)} ${esc(GHS[g]||"")}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)" style="fill:var(--ghs-bg);stroke:var(--ghs)" stroke-width="2"/><text x="12" y="14.8" text-anchor="middle" font-size="7" font-weight="700" font-family="Geist Mono,monospace" style="fill:var(--fg)">${esc(String(g).slice(3))}</text></svg></span>`}
const ghsRow=list=>(list&&list.length)?`<span class="ghsrow">${list.map(g=>ghsIcon(g)).join("")}</span>`:`<span class="sub">bez piktogramu</span>`;

/* ---------- Automatika: upozornenia ---------- */
function alerts(){
  const out=[],cfg=S.config;
  const where=b=>`${labName(b.lab)}${b.place?" · "+b.place:""}`;
  for(const b of Object.values(S.bottles)){
    if(!active(b))continue;
    const c=S.chems[b.chem],nm=c?c.name:"Neznáma chemikália";
    if(b.expiry){const d=days(b.expiry);
      if(d<0)out.push({sev:"crit",kind:"Expirácia",text:`${nm} je po expirácii (od ${fmtD(b.expiry)})`,where:where(b),href:"#f-"+b.id,lab:b.lab});
      else if(d<=cfg.expiryWarnDays)out.push({sev:"warn",kind:"Expirácia",text:`${nm} expiruje o ${d} dní (${fmtD(b.expiry)})`,where:where(b),href:"#f-"+b.id,lab:b.lab});}
    if(c&&c.peroxide&&b.opened){const m=-days(b.opened)/30.44;
      if(m>=cfg.peroxideMonths)out.push({sev:"crit",kind:"Peroxidy",text:`${nm}: otvorené ${Math.floor(m)} mes. Otestujte na peroxidy alebo zlikvidujte.`,where:where(b),href:"#f-"+b.id,lab:b.lab});}
  }
  const groups={};
  for(const b of Object.values(S.bottles)){if(!active(b))continue;const k=b.lab+"|"+String(b.place||"").trim().toLowerCase();(groups[k]=groups[k]||[]).push(b)}
  const names=bs=>[...new Set(bs.map(b=>chemName(b.chem)))].join(", ");
  for(const bs of Object.values(groups)){
    const ox=bs.filter(b=>S.chems[b.chem]?.ghs?.includes("GHS03")),fl=bs.filter(b=>S.chems[b.chem]?.ghs?.includes("GHS02")&&!S.chems[b.chem]?.ghs?.includes("GHS03"));
    if(ox.length&&fl.length)out.push({sev:"crit",kind:"Skladovanie",text:`Oxidujúce látky (${names(ox)}) sú v jednej skrini s horľavými (${names(fl)})`,where:where(bs[0]),href:"#f-"+ox[0].id,lab:bs[0].lab});
  }
  for(const c of chemList()){
    const bs=bottlesOf(c.id).filter(active);if(!bs.length)continue;
    const sd=sdsOf(c.id),labs=[...new Set(bs.map(b=>labName(b.lab)))].join(", ");
    if(!sd.length)out.push({sev:"crit",kind:"Karta SDS",text:`${c.name}: chýba karta bezpečnostných údajov`,where:labs,href:"#c-"+c.id});
    else{
      const y=sd[0].revision?-days(sd[0].revision)/365.25:99;
      if(y>cfg.sdsMaxYears)out.push({sev:"warn",kind:"Karta SDS",text:`${c.name}: najnovšia SDS je z ${fmtD(sd[0].revision)}, vyžiadajte aktuálnu verziu`,where:labs,href:"#c-"+c.id});
      if(!sd.some(s=>s.lang==="sk"))out.push({sev:"warn",kind:"Karta SDS",text:`${c.name}: chýba SDS v slovenčine`,where:labs,href:"#c-"+c.id});
    }
    if(+c.minQty>0){const t=total(c);if(t<+c.minQty)out.push({sev:"warn",kind:"Zásoba",text:`${c.name}: zostáva ${fmtQ(t,c.unit)}, minimum je ${fmtQ(c.minQty,c.unit)}. Doobjednať.`,where:labs,href:"#c-"+c.id});}
  }
  return out.sort((a,b)=>(a.sev==="crit"?0:1)-(b.sev==="crit"?0:1));
}
const alertList=al=>al.length?`<ul class="alerts">${al.map(a=>`<li class="${a.sev}"><span class="bar"></span><div><div><span class="chip">${esc(a.kind)}</span><span class="t">${esc(a.text)}</span></div><div class="sub">${esc(a.where||"")}</div></div><a class="btn small" href="${a.href}">Otvoriť</a></li>`).join("")}</ul>`:`<div class="empty">Bez upozornení. Všetko je v poriadku.</div>`;

/* ---------- Pohľady ---------- */
function vPrehlad(){
  const al=alerts(),act=Object.values(S.bottles).filter(active);
  const used=[...new Set(act.map(b=>b.chem))],withSds=used.filter(c=>sdsOf(c).length).length;
  const crit=al.filter(a=>a.sev==="crit").length,warn=al.length-crit;
  return `<div class="stack">
  <div class="row between"><h1>Prehľad</h1><span class="sub">Stav k ${fmtD(todayISO())}</span></div>
  <div class="stats">
    <div class="stat"><div class="k">Aktívne balenia</div><div class="v">${act.length}</div></div>
    <div class="stat"><div class="k">Chemikálie v skladoch</div><div class="v">${used.length}</div></div>
    <div class="stat"><div class="k">Pokrytie kartami SDS</div><div class="v">${withSds}<small> / ${used.length}</small></div></div>
    <div class="stat"><div class="k">Upozornenia</div><div class="v"><span style="color:var(--crit)">${crit}</span><small> kritické · </small><span style="color:var(--warn)">${warn}</span><small> ostatné</small></div></div>
  </div>
  <div class="grid2">
    <section class="panel"><div class="row between" style="margin-bottom:6px"><h2>Upozornenia</h2><span class="sub">vyhodnocuje sa automaticky</span></div>${alertList(al)}</section>
    <section class="panel"><h2 style="margin-bottom:10px">Laboratóriá</h2>
      <div class="stack" style="gap:10px">${labList().map(l=>{const n=act.filter(b=>b.lab===l.id).length,a=al.filter(x=>x.lab===l.id).length;
        return `<div class="row between"><div><a href="#laboratoria" data-act="go-lab" data-id="${esc(l.id)}">${esc(l.name)}</a><div class="sub">${esc(l.room||"")}</div></div><div class="row" style="gap:6px"><span class="pill p-mute">${n} balení</span>${a?`<span class="pill p-warn">${a} upoz.</span>`:`<span class="pill p-ok">OK</span>`}</div></div>`}).join("")||`<div class="sub">Zatiaľ žiadne laboratórium.</div>`}</div>
      <p class="sub" style="margin:14px 0 0">Kontroly: expirácia (${S.config.expiryWarnDays} dní vopred), peroxidotvorné látky (${S.config.peroxideMonths} mes. od otvorenia), vek SDS (${S.config.sdsMaxYears} roky), SDS v slovenčine, minimálna zásoba, oxidujúce látky v jednej skrini s horľavými.</p>
    </section>
  </div></div>`;
}

function filteredBottles(){
  const q=UI.q.trim().toLowerCase();
  return Object.values(S.bottles).filter(b=>{
    if(UI.lab&&b.lab!==UI.lab)return false;
    if(UI.status==="active"&&!active(b))return false;
    if(UI.status==="empty"&&active(b))return false;
    if(q){const c=S.chems[b.chem]||{};const hay=[c.name,c.cas,c.formula,b.id,codeOf(b.id),b.place,b.lot,b.supplier].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>chemName(a.chem).localeCompare(chemName(b.chem),"sk"));
}
function expPill(b){if(!b.expiry)return `<span class="sub">—</span>`;const d=days(b.expiry);const cls=d<0?"p-crit":d<=S.config.expiryWarnDays?"p-warn":"p-mute";return `<span class="pill ${cls}">${fmtD(b.expiry)}</span>`}
const statPill=b=>active(b)?(b.opened?`<span class="pill p-ok">otvorené</span>`:`<span class="pill p-mute">neotvorené</span>`):`<span class="pill p-mute">prázdne</span>`;

function vSklad(){

/* ---------- Render ---------- */
function route(){const h=decodeURIComponent(location.hash.slice(1));return h||"prehlad"}
let rq=false;
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;doRender()})}
function doRender(){
  const r=route(),main=$("#main");
  document.body.classList.toggle("ro",S.canWrite===false);
  const tab=r.startsWith("f-")?UI.last:r.startsWith("c-")?"chemikalie":r;
  document.querySelectorAll("#tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  let html;
  if(S.noRuntime)html=`<div class="panel empty"><h2>Aplikácia beží mimo Claude</h2><p>Otvorte ju cez odkaz na claude.ai, aby sa načítala spoločná databáza skladu.</p></div>`;
  else if(!db)html=`<div class="empty">Pripájam databázu skladu…</div>`;
  else if(!["labs","chems","bottles","sds"].every(k=>S.got[k]))html=`<div class="empty">${S.stale?"Dáta sa zatiaľ nedajú načítať. Skontrolujte pripojenie.":"Načítavam sklad…"}</div>`;
  else{
    const pre=S.canWrite===false?`<div class="banner" style="margin-bottom:16px">Máte prístup len na čítanie. Zápisy do skladu robia prispievatelia a editori.</div>`:"";
    if(r.startsWith("f-"))html=vBottle(r.slice(2).toLowerCase());
    else if(r.startsWith("c-"))html=vChem(r.slice(2));
    else html=({prehlad:vPrehlad,sklad:vSklad,chemikalie:vChems,laboratoria:vLabs,historia:vHistory,nastavenia:vSettings}[r]||vPrehlad)();
    html=pre+html;
  }
  // zachovať rozpísané vstupy
  const keep={},foc=document.activeElement&&main.contains(document.activeElement)?document.activeElement.id:null;let selS=null,selE=null;
  main.querySelectorAll("input[id],select[id]").forEach(el=>{keep[el.id]=el.value});
  if(foc){try{selS=document.activeElement.selectionStart;selE=document.activeElement.selectionEnd}catch(e){}}
  main.innerHTML=html;
  for(const [k,v] of Object.entries(keep)){const el=document.getElementById(k);if(el&&main.contains(el)&&!["fLab","fStatus"].includes(k))el.value=v}
  if(foc){const el=document.getElementById(foc);if(el){el.focus();try{if(selS!=null)el.setSelectionRange(selS,selE)}catch(e){}}}
  fillNames(main);
}
async function fillNames(root){
  const els=[...root.querySelectorAll("[data-uid]")];if(!els.length)return;
  const ids=[...new Set(els.map(e=>e.dataset.uid))];
  if(!user){els.forEach(e=>e.textContent="používateľ");return}
  const ps=await user.profiles(ids);
  els.forEach(e=>{const p=ps[e.dataset.uid];e.textContent=(p&&p.name)||(p&&p.isMe?"vy":"člen oddelenia")});
}

/* ---------- Zápisy ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
async function W(fn,ok){
  if(!db){toast("Databáza nie je dostupná.");return false}
  try{await fn();if(ok)toast(ok);return true}
  catch(e){const c=e&&e.code;toast(c==="invalid_argument"?"Zápis bol odmietnutý. Nemáte oprávnenie upravovať sklad.":c==="quota_exceeded"?"Databáza je plná, vymažte staré záznamy.":"Zápis zlyhal, skúste to znova.");if(c==="invalid_argument"&&S.canWrite==null){S.canWrite=false;render()}return false}
}
const logAct=(text,bottle,chem)=>db.collection("log").doc(Date.now().toString(36)+nid(4)).set({at:new Date().toISOString(),by:S.me||null,bottle:bottle||null,chem:chem||null,text});

/* ---------- Dialógy ---------- */
const dlg=$("#dlg");let onSubmit=null;
function openDlg(title,body,submitLabel,handler,danger){
  onSubmit=handler;
  dlg.innerHTML=`<form id="dlgForm" novalidate><div class="dh"><h2>${esc(title)}</h2><button type="button" class="small" data-act="close" aria-label="Zavrieť">Zavrieť</button></div><div class="db">${body}</div>${submitLabel?`<div class="df"><button type="button" data-act="close">Zrušiť</button><button type="submit" class="${danger?"danger":"primary"}">${esc(submitLabel)}</button></div>`:""}</form>`;
  try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}
  const first=dlg.querySelector(".db input:not([type=checkbox]),.db select");if(first)first.focus();
}
const closeDlg=()=>{try{dlg.close()}catch(e){dlg.removeAttribute("open")}};
dlg.addEventListener("submit",async e=>{
  e.preventDefault();if(!onSubmit)return closeDlg();
  const f=e.target,btn=f.querySelector("button[type=submit]");
  const req=[...f.querySelectorAll("[required]")].find(el=>!String(el.value).trim());
  if(req){req.focus();toast("Vyplňte povinné pole.");return}
  if(btn)btn.disabled=true;
  const ok=await onSubmit(new FormData(f),f);
  if(btn)btn.disabled=false;
  if(ok!==false)closeDlg();
});

async function decodeCode(bmp){
  if("BarcodeDetector" in window){try{const r=await new BarcodeDetector().detect(bmp);if(r&&r.length)return r.map(x=>x.rawValue).filter(Boolean).join("\n")}catch(e){}}
  if(typeof jsQR==="function"){try{
    const k=Math.min(1,1800/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(bmp,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height);if(r&&r.data)return r.data}catch(e){}}
  return "";
}
function toJpeg(bmp){return new Promise(res=>{const k=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);c.toBlob(b=>res(b),"image/jpeg",.9)})}

async function makePdf(d){
  const L=d.landscape,M=12,wMm=L?273:186,hMm=(L?210:297)-2*M-6;
  const opt={margin:M,html2canvas:{scale:2,backgroundColor:"#ffffff",logging:false,scrollX:0,scrollY:0},jsPDF:{unit:"mm",format:"a4",orientation:L?"landscape":"portrait"}};
  /* html2canvas počíta pozíciu podľa posunutia stránky – počas vykresľovania ju vrátime na začiatok, inak je obsah posunutý alebo prázdny */
  const sx=window.scrollX,sy=window.scrollY;window.scrollTo(0,0);
  const src=document.createElement("div");src.innerHTML=d.html;
  const stage=document.createElement("div");stage.style.cssText="position:fixed;left:-20000px;top:0;background:#fff";document.body.appendChild(stage);
  try{
    const newPage=()=>{const p=document.createElement("div");p.className="pd"+(L?" pd-l":"");stage.appendChild(p);return p};
    let page=newPage();const pages=[page],maxH=hMm*(page.getBoundingClientRect().width/wMm);
    const fits=()=>page.scrollHeight<=maxH;
    const fresh=()=>{page=newPage();pages.push(page)};
    for(const el of [...src.children]){
      if(el.tagName==="TABLE"&&el.tBodies[0]){
        const head=el.tHead,rows=[...el.tBodies[0].rows];
        const mk=()=>{const t=document.createElement("table");if(head)t.appendChild(head.cloneNode(true));const b=document.createElement("tbody");t.appendChild(b);page.appendChild(t);return b};
        let tb=mk();
        for(const r of rows){tb.appendChild(r);
          if(!fits()&&tb.rows.length>1){tb.removeChild(r);fresh();tb=mk();tb.appendChild(r)}
          else if(!fits()&&tb.rows.length===1&&page.children.length>1){page.removeChild(tb.parentNode);fresh();tb=mk();tb.appendChild(r)}}
      }else{page.appendChild(el);if(!fits()&&page.children.length>1){page.removeChild(el);fresh();page.appendChild(el)}}
    }
    const canv=[];for(const pg of pages)canv.push(await html2pdf().set(opt).from(pg).toCanvas().get("canvas"));
    const pdf=await html2pdf().set(opt).from(document.createElement("div")).toPdf().get("pdf");
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    for(let i=0;i<pages.length;i++){
      const cv=canv[i];
      if(i)pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",M,M,wMm,cv.height/cv.width*wMm);
      if(pages.length>1){pdf.setFontSize(8);pdf.setTextColor(80);pdf.text(`Strana ${i+1} / ${pages.length}`,pw-M,ph-7,{align:"right"})}
    }
    return pdf.output("blob");
  }finally{stage.remove();window.scrollTo(sx,sy)}
}

function printLabH(labId){
  const lab=S.labs[labId],rows=labChems(labId);if(!lab)return;
  if(!rows.length){toast("V tomto laboratóriu nie sú žiadne aktívne balenia.");return}
  const byH={},ghs=new Set();let danger=false,warn=false;const noH=[];
  for(const {c} of rows){(c.ghs||[]).forEach(g=>ghs.add(g));if(c.signal==="Nebezpečenstvo")danger=true;if(c.signal==="Pozor")warn=true;
    const hs=hCodes(c.hazards);if(!hs.length&&(c.ghs||[]).length)noH.push(c.name);hs.forEach(h=>(byH[h]=byH[h]||[]).push(c.name))}
  const codes=Object.keys(byH).sort(hSort);
  if(!codes.length&&!ghs.size){toast("Chemikálie v tomto laboratóriu nemajú zapísané žiadne H-vety.");return}
  const body=`${danger||warn?`<div class="sig">${danger?"Nebezpečenstvo":"Pozor"}</div>`:""}
  ${ghs.size?`<div class="pict">${[...ghs].sort().map(g=>`<div>${pGhs(g)}<span>${esc(GHS[g]||g)}</span></div>`).join("")}</div>`:""}
  <table><thead><tr><th>Kód</th><th>Výstražné upozornenie</th><th>Látky v miestnosti</th></tr></thead><tbody>${codes.map(h=>`<tr><td class="code">${esc(h)}</td><td class="txt">${esc(hText(h)||"Znenie nie je v slovníku aplikácie, doplňte podľa SDS.")}</td><td class="small">${esc(byH[h].join(", "))}</td></tr>`).join("")}</tbody></table>
  ${noH.length?`<p class="small" style="margin-top:3mm">Bez zapísaných H-viet: ${esc(noH.join(", "))}.</p>`:""}`;
  return {name:`h-vety-dvere-${labSlug(lab)}-${todayISO()}`,html:pdBody("Nebezpečné chemické látky v miestnosti",lab,body),landscape:false};
}

  if(user){try{const me=await user.me();S.me=me.id;S.canEdit=!!me.canEdit;const cw=await user.can("data.write");S.canWrite=cw===null?null:!!cw}catch(e){}}
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  const toMap=s=>Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
  const err=k=>e=>{S.got[k]=true;S.stale=true;render()};
  for(const k of ["labs","chems","bottles","sds"]){
    db.collection(k).onSnapshot(s=>{S[k]=toMap(s);if(!s.metadata.fromCache)S.got[k]=true;else if(s.size)S.got[k]=true;if(["labs","chems","bottles","sds"].every(x=>S.got[x]))clearTimeout(timer);render()},err(k));
  }
  db.collection("log").orderBy("at","desc").limit(150).onSnapshot(s=>{S.log=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.doc("config/app").onSnapshot(s=>{S.config={...DEF_CFG,...(s.exists?s.data():{})};render()},()=>{});
})();
</script>
